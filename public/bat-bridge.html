<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bat Bridge Bound: An Austin Adventure (Pixel Edition)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --px: 4px;
    --page: #f6efe0;
    --ink: #2c2347;
    --ink-soft: #5d557a;
    --panel: #fffaf0;
    --panel-text: #2c2347;
    --blue: #3f5fc8;
    --pink: #d63c78;
    --orange: #ef8a2b;
    --yellow: #f3c33b;
    --night: #2c2347;
    --slot: #e6dcc8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1b1630; --ink: #f4eefc; --ink-soft: #bdb4d6; --panel: #2a2342;
      --panel-text: #f4eefc; --slot: #3d3460; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #1b1630; --ink: #f4eefc; --ink-soft: #bdb4d6; --panel: #2a2342;
    --panel-text: #f4eefc; --slot: #3d3460; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Fredoka", system-ui, sans-serif;
    line-height: 1.4;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* Stepped "pixel" frame: a 1-step notch at each corner */
  .px-frame {
    box-shadow:
      0 calc(-1 * var(--px)) 0 0 var(--frame, #2c2347),
      0 var(--px) 0 0 var(--frame, #2c2347),
      calc(-1 * var(--px)) 0 0 0 var(--frame, #2c2347),
      var(--px) 0 0 0 var(--frame, #2c2347);
  }

  /* Wide screens: the landscape board with the deck, card and story underneath */
  .game { position: relative; max-width: 1040px; margin: 0 auto; padding: 18px 20px 28px; overflow: hidden; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .screen { position: relative; margin: var(--px); background: #9ccf6e; }
  #board { display: block; width: 100%; height: auto; }

  .controls {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 22px;
    align-items: center;
    margin-top: 22px;
  }
  .bar, .scrim, .continue { display: none; }
  .deck {
    appearance: none; border: 0; padding: 0; background: none; cursor: pointer;
    font: inherit; color: inherit; display: grid; justify-items: center; gap: 10px;
  }
  .card {
    width: 88px; height: 120px; margin: var(--px);
    display: grid; place-items: center; align-content: center; gap: 6px;
  }
  .card-back {
    background:
      repeating-linear-gradient(0deg, transparent 0 8px, rgba(255,255,255,.07) 8px 12px),
      var(--night);
    --frame: #f3c33b;
    position: relative;
  }
  .deck-stack { position: relative; transition: transform .12s steps(2); }
  .deck-stack::before {
    content: ""; position: absolute; inset: var(--px);
    transform: translate(8px, 8px); background: #4e3a80;
    box-shadow: 0 0 0 var(--px) #2c2347;
  }
  .deck:hover .deck-stack { transform: translateY(-4px); }
  .deck-label {
    background: var(--pink); color: #fff; font-weight: 600; font-size: 1.05rem;
    padding: 6px 14px; margin: var(--px); white-space: nowrap; --frame: #2c2347;
  }
  .deck-count { font-size: .9rem; color: var(--ink-soft); margin-top: -4px; }
  .deck:focus-visible { outline: none; }
  .deck:focus-visible .deck-label { outline: 3px dashed var(--blue); outline-offset: 7px; }
  .deck[disabled] { cursor: default; }
  .deck[disabled] .deck-label { background: #8a83a3; }
  .deck[disabled] .deck-stack { transform: none; }

  .drawn { width: 96px; height: 128px; display: grid; place-items: center; }
  .slot {
    width: 88px; height: 120px; margin: var(--px);
    background: var(--slot); color: var(--ink-soft);
    display: grid; place-items: center; text-align: center; font-size: .9rem; padding: 8px;
    --frame: var(--ink-soft);
  }
  .face { color: #fff; font-weight: 600; font-size: .98rem; text-align: center; --frame: #2c2347; position: relative; line-height: 1.1; }
  .face .gem { background: #fffaf0; width: 56px; height: 56px; display: grid; place-items: center; --frame: #2c2347; margin: var(--px); }
  .face .gem canvas { width: 44px; height: auto; }
  .face .times {
    position: absolute; top: 4px; right: 4px; background: #fff36b; color: #2c2347;
    font-size: .85rem; padding: 0 4px; --frame: #2c2347; --px: 2px;
  }
  .face.double { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.18) 6px 10px); }
  .flip { animation: flip .36s steps(4); }
  @keyframes flip { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }

  .story {
    background: var(--panel); color: var(--panel-text);
    padding: 14px 18px; margin: var(--px);
    display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
    min-height: 128px; --frame: var(--ink);
  }
  .story.no-art { grid-template-columns: 1fr; }
  .story-art { width: 96px; display: grid; place-items: center; }
  .story-art canvas { max-width: 96px; height: auto; }
  .story.no-art .story-art { display: none; }
  .story h2 { margin: 0 0 4px; font-size: 1.28rem; font-weight: 600; line-height: 1.15; }
  .story p { margin: 0; color: var(--ink-soft); max-width: 60ch; font-size: 1.04rem; }
  .story .note { display: block; margin-top: 4px; color: var(--pink); font-weight: 600; }
  .progress { display: flex; gap: 6px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .progress span { width: 12px; height: 12px; background: var(--slot); box-shadow: inset 0 0 0 2px var(--ink-soft); }
  .progress span.on { background: var(--orange); box-shadow: inset 0 0 0 2px #2c2347; }
  .progress small { white-space: nowrap; margin-left: 8px; color: var(--ink-soft); font-size: .92rem; }

  .win {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .4s steps(4); overflow-y: auto;
  }
  .win.show { opacity: 1; pointer-events: auto; }
  .win-box {
    background: var(--night); color: #fff; text-align: center;
    padding: 16px 22px 20px; max-width: 480px; --frame: #f3c33b;
  }
  .win-box canvas { width: 64px; height: auto; display: block; margin: 0 auto 6px; }
  .win h2 { font-size: clamp(1.3rem, 3.4vw, 1.9rem); margin: 0 0 6px; line-height: 1.1; }
  .win p { margin: 0 auto 12px; color: #e6def7; }
  .route { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; }
  .route li { background: #4e3a80; padding: 2px 8px; font-size: .9rem; }
  .route li + li::before { content: "› "; color: #f3c33b; }
  .found { color: #f3c33b !important; font-weight: 600; }
  .again {
    appearance: none; border: 0; font: inherit; font-weight: 600; font-size: 1.1rem;
    background: var(--yellow); color: #2c2347; padding: 8px 22px; cursor: pointer; --frame: #fff;
  }
  .again:focus-visible { outline: 3px dashed #fff; outline-offset: 7px; }

  /* Phones: the portrait board fills the screen, with a bar underneath and a window that slides up after each move */
  .game[data-layout="portrait"] {
    --bar-h: 74px;
    max-width: none; height: 100dvh; padding: 8px 8px 0; display: flex; flex-direction: column;
  }
  .game[data-layout="portrait"] .screen {
    /* as wide as possible, but never taller than the screen minus the bar */
    width: min(calc(100% - 8px), calc((100dvh - var(--bar-h) - 32px) * 240 / 344));
    margin: auto; flex: none;
  }
  .game[data-layout="portrait"] .bar {
    display: flex; align-items: center; gap: 10px; height: var(--bar-h);
    padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .mini .card, .mini .slot { width: 38px; height: 52px; margin: var(--px); padding: 0; }
  .mini .face { font-size: 0; gap: 0; }
  .mini .face .gem { width: 26px; height: 26px; margin: 0; }
  .mini .face .gem canvas { width: 20px; }
  .mini .face .times { font-size: .6rem; top: -6px; right: -8px; }
  .latest {
    flex: 1; min-width: 0; margin: var(--px); padding: 8px 10px; cursor: pointer;
    appearance: none; border: 0; font: inherit; font-size: .85rem; text-align: left;
    background: var(--panel); color: var(--ink-soft); --frame: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .latest b { color: var(--panel-text); font-weight: 600; }
  .flip-btn {
    appearance: none; border: 0; font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;
    background: var(--pink); color: #fff; padding: 10px 12px; margin: var(--px); white-space: nowrap; --frame: #2c2347;
  }
  .flip-btn[disabled] { background: #8a83a3; cursor: default; }
  .flip-btn:focus-visible, .latest:focus-visible, .continue:focus-visible { outline: 3px dashed var(--blue); outline-offset: 6px; }

  .game[data-layout="portrait"] .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; margin: 0;
    grid-template-columns: auto 1fr; gap: 12px 14px; align-items: start; max-height: 80%; overflow-y: auto;
    padding: 18px 14px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--page); box-shadow: 0 -4px 0 0 var(--ink), 0 -14px 30px rgba(0,0,0,.3);
    transform: translateY(105%); visibility: hidden; transition: transform .3s steps(6), visibility 0s .3s;
  }
  .game[data-layout="portrait"].sheet-open .controls { transform: none; visibility: visible; transition: transform .3s steps(6); }
  .game.switching .controls { transition: none !important; }
  .game[data-layout="portrait"].sheet-open .scrim { display: block; position: absolute; inset: 0; z-index: 2; background: rgba(28,22,52,.45); }
  .game[data-layout="portrait"] .deck, .game[data-layout="portrait"] .story-art { display: none; }
  .game[data-layout="portrait"] .story { min-height: 0; padding: 10px 12px; grid-template-columns: 1fr; }
  .game[data-layout="portrait"] .story h2 { font-size: 1.1rem; }
  .game[data-layout="portrait"] .story p { font-size: .95rem; }
  .game[data-layout="portrait"] .continue {
    display: block; grid-column: 1 / -1; margin: 4px var(--px) var(--px);
    appearance: none; border: 0; font: inherit; font-weight: 600; font-size: 1.1rem; cursor: pointer;
    background: var(--yellow); color: #2c2347; padding: 10px; --frame: #2c2347;
  }
  /* The board is too small to hold the results here, so they cover the page instead. */
  .game[data-layout="portrait"] .win { position: fixed; z-index: 10; background: rgba(28,22,52,.6); }
  .game[data-layout="portrait"] .win-box { padding: 12px 14px 16px; }
  .game[data-layout="portrait"] .win-box canvas { width: 52px; }
  .game[data-layout="portrait"] .win p { font-size: .95rem; margin-bottom: 10px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="game">
  <h1 class="sr-only">Bat Bridge Bound: an Austin board game</h1>

  <div class="screen px-frame">
    <canvas id="board" width="320" height="224" role="img"
      aria-label="Pixel-art game board: a trail from the start that forks three times on its way to the Congress Avenue Bat Bridge. First fork: Barton Springs or Zilker Park. Then Mural Stop. Second fork: Circuit of The Americas or tacos and barbecue. Then shopping on South Congress. Third fork: live music downtown, or the hike-and-bike trail, where a turtle gives you a ride across Lady Bird Lake."></canvas>
    <div class="win" id="win" aria-live="polite">
      <div class="win-box px-frame">
        <canvas data-sprite="bat_a" data-scale="4" aria-hidden="true"></canvas>
        <h2>You made it to Bat Bridge!</h2>
        <p id="win-text"></p>
        <ol class="route" id="win-route" aria-label="Your route"></ol>
        <p class="found" id="win-found"></p>
        <button class="again px-frame" id="again">Play again</button>
      </div>
    </div>
  </div>

  <!-- Phones only: your card, the latest news and the flip button, under the board -->
  <div class="bar">
    <div class="mini" id="mini" aria-hidden="true"><div class="slot px-frame"></div></div>
    <button class="latest px-frame" id="latest" aria-label="Show what happened"></button>
    <button class="flip-btn px-frame" id="flip">Flip a card</button>
  </div>
  <div class="scrim" id="scrim"></div>

  <div class="controls" id="panel">
    <button class="deck" id="deck" aria-describedby="story-title">
      <span class="deck-stack" aria-hidden="true">
        <span class="card card-back px-frame"><canvas data-sprite="bat_a" data-scale="3" style="width:60px"></canvas></span>
      </span>
      <span class="deck-label px-frame">Flip a card</span>
      <span class="deck-count" id="deck-count"></span>
    </button>

    <div class="drawn" id="drawn" aria-live="polite">
      <div class="slot px-frame">Your card shows here</div>
    </div>

    <div class="story px-frame" id="story" aria-live="polite">
      <div class="story-art"><canvas id="story-canvas"></canvas></div>
      <div>
        <h2 id="story-title">Welcome to Austin!</h2>
        <p id="story-text"></p>
        <div class="progress" id="progress" aria-label="Stops reached"></div>
      </div>
    </div>

    <button class="continue px-frame" id="continue">Continue</button>
  </div>
</div>

  //  Game flow
  // =====================================================================
  var deckBtn = document.getElementById("deck");
  var deckCount = document.getElementById("deck-count");
  var drawnBox = document.getElementById("drawn");
  var storyEl = document.getElementById("story");
  var storyCanvas = document.getElementById("story-canvas");
  var storyTitle = document.getElementById("story-title");
  var storyText = document.getElementById("story-text");
  var progress = document.getElementById("progress");
  var win = document.getElementById("win");
  var gameEl = document.querySelector(".game");
  var miniBox = document.getElementById("mini");
  var latestBtn = document.getElementById("latest");
  var flipBtn = document.getElementById("flip");
  var continueBtn = document.getElementById("continue");

  var STOPS_PER_GAME = FORKS.length * 2; // a landmark at each fork, Mural Stop, South Congress and the bridge
  var pos, game, drawCount, route, busy, run = 0;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, reduceMotion ? 0 : ms); }); }

  function renderProgress() {
    progress.innerHTML = "";
    for (var i = 0; i < STOPS_PER_GAME; i++) { var s = document.createElement("span"); if (i < route.length) s.className = "on"; progress.appendChild(s); }
    var small = document.createElement("small");
    small.textContent = route.length + " of " + STOPS_PER_GAME + " stops · " + drawCount + (drawCount === 1 ? " card" : " cards") + " flipped";
    progress.appendChild(small);
    var left = game.deck.length - drawCount;
    deckCount.textContent = left + " cards in the deck";
  }

  // `art` is a friend's name, a sprite name, or nothing
  function setStory(title, text, art, note) {
    storyTitle.textContent = title; storyText.textContent = text;
    latestBtn.innerHTML = ""; var b = document.createElement("b"); b.textContent = title + " ";
    latestBtn.appendChild(b); latestBtn.appendChild(document.createTextNode(text));
    if (note) { var n = document.createElement("span"); n.className = "note"; n.textContent = note; storyText.appendChild(n); }
    if (art) {
      var sprite = art === "bat" ? "bat_a" : art, sz = spriteSize(sprite);
      paintSpriteCanvas(storyCanvas, sprite, sz.w > 20 ? 4 : 6);
      storyEl.classList.remove("no-art");
    } else storyEl.classList.add("no-art");
  }

  function showCard(card) {
    var c = COLORS[card.color];
    drawnBox.innerHTML = "";
    var face = document.createElement("div");
    face.className = "card face px-frame flip" + (card.steps > 1 ? " double" : "");
    face.style.background = c.hex;
    var gem = document.createElement("span"); gem.className = "gem px-frame";
    var cv = document.createElement("canvas"); paintSpriteCanvas(cv, c.icon, 4);
    gem.appendChild(cv);
    var label = document.createElement("span"); label.textContent = card.steps > 1 ? "Double " + c.name.toLowerCase() : c.name;
    face.appendChild(gem); face.appendChild(label);
    if (card.steps > 1) { var t = document.createElement("span"); t.className = "times px-frame"; t.textContent = "×2"; face.appendChild(t); }
    drawnBox.appendChild(face);
    miniBox.innerHTML = ""; miniBox.appendChild(face.cloneNode(true));
  }
  function showSlot() {
    drawnBox.innerHTML = '<div class="slot px-frame">Your card shows here</div>';
    miniBox.innerHTML = '<div class="slot px-frame"></div>';
  }

  function placeToken(id) { token.x = spaces[id].x; token.y = spaces[id].y + 2; token.lift = 0; }

  function animate(ms, step) {
    return new Promise(function (resolve) {
      if (reduceMotion) { step(1); resolve(); return; }
      var t0 = performance.now();
      (function f(now) {
        var t = Math.min(1, (now - t0) / ms); step(t);
        if (t < 1) requestAnimationFrame(f); else resolve();
      })(t0);
    });
  }
  function hopTo(id) {
    var a = { x: token.x, y: token.y }, b = { x: spaces[id].x, y: spaces[id].y + 2 };
    return animate(230, function (t) {
      var st = Math.round(t * 6) / 6; // step the motion so it moves in chunky frames
      token.x = a.x + (b.x - a.x) * st; token.y = a.y + (b.y - a.y) * st; token.lift = Math.sin(st * Math.PI) * 7;
    });
  }
  function rideTurtle() {
    var ride = rides[pos], pts = ride.pts, f = FRIENDS.turtle;
    return animate(1600, function (t) {
      var p = pts[Math.round(t * (pts.length - 1))];
      token.x = p.x; token.y = p.y - 4; token.lift = 0;
      f.x = Math.round(p.x); f.y = Math.round(p.y) + 4; f.flip = true;
    }).then(function () {
      pos = ride.to; return hopTo(pos);
    }).then(function () {
      return wait(300);
    }).then(function () { f.x = f.homeX; f.y = f.homeY; f.flip = false; });
  }
  function cheer(name) { if (FRIENDS[name]) FRIENDS[name].hop = 12; }

  async function draw() {
    if (busy || pos === "bridge") return;
    var id = run;
    busy = true; deckBtn.disabled = true; flipBtn.disabled = true; closeSheet();
    var card = game.deck[drawCount], c = COLORS[card.color];
    var path = plotMove(pos, card);
    drawCount++; renderProgress(); showCard(card); startCardFx(card);
    setStory(
      card.steps > 1 ? "Double " + c.name.toLowerCase() + "!" : "You flipped " + c.name + ".",
      card.steps > 1 ? "Hop two " + c.name.toLowerCase() + " spaces ahead." : "Hop to the next " + c.name.toLowerCase() + " space.",
      null
    );
    await wait(1100);
    for (var i = 0; i < path.length; i++) {
      await hopTo(path[i]); if (id !== run) return; pos = path[i];
    }

    var key = spaces[pos].stop, stop = STOPS[key];
    if (stop) {
      route.push(key); renderProgress();
      setStory(stop.title, freshTidbit(key, stop.facts), stop.friend ? stop.friend.name : stop.icon);
      if (stop.friend) cheer(stop.friend.name);
      if (rides[pos]) { await wait(1800); if (id !== run) return; await rideTurtle(); }
      if (pos === "bridge") { await wait(1400); if (id !== run) return; finish(); return; }
    } else {
      var title = TIDBIT_TITLES[drawCount % TIDBIT_TITLES.length];
      setStory(title, freshTidbit("tidbits", TIDBITS), COLORS[spaces[pos].color].icon);
    }
    if (id !== run) return;
    busy = false; deckBtn.disabled = false; flipBtn.disabled = false;
    if (pendingLayout) applyLayout(pendingLayout);
    if (layout === "portrait") openSheet(); else deckBtn.focus({ preventScroll: true });
  }

  // The phone window that slides up after each move
  function openSheet() { gameEl.classList.add("sheet-open"); continueBtn.focus({ preventScroll: true }); }
  function closeSheet() {
    if (!gameEl.classList.contains("sheet-open")) return;
    gameEl.classList.remove("sheet-open");
    if (layout === "portrait" && !flipBtn.disabled) flipBtn.focus({ preventScroll: true });
  }

  function finish() {
    var key = routeKey(route), firstTime = memory.found.indexOf(key) < 0;
    memory.recent = memory.recent.filter(function (r) { return r !== key; }).concat([key]).slice(-ROUTE_MEMORY);
    if (firstTime) memory.found.push(key);
    memory.seqs = memory.seqs.concat([game.order]).slice(-50);
    remember();

    document.getElementById("win-text").textContent = "You flipped " + drawCount + " cards and wandered this way through Austin:";
    var list = document.getElementById("win-route"); list.innerHTML = "";
    ["start"].concat(route).forEach(function (k) { var li = document.createElement("li"); li.textContent = STOPS[k].name; list.appendChild(li); });
    var left = ALL_ROUTES.length - memory.found.length;
    document.getElementById("win-found").textContent =
      (firstTime ? "New route! " : "") + "You’ve explored " + memory.found.length + " of " + ALL_ROUTES.length + " routes to Bat Bridge." +
      (left ? " Play again to try a new path." : " You found them all. Way to go!");

    flock = [];
    var br = NODES.bridge;
    for (var i = 0; i < 26; i++) {
      flock.push({ x0: br.x - 10 + Math.random() * 40, y0: br.y + 20 + Math.random() * 30, vx: -0.3 + Math.random() * 1.6,
                   vy: 0.9 + Math.random() * 1.1, ph: Math.random() * 6, delay: Math.floor(Math.random() * 30) });
    }
    for (var k = 0; k < 14; k++) {
      flock.push({ x0: Math.random() * W, y0: H + 10 + Math.random() * 40, vx: (Math.random() - 0.5), vy: 1 + Math.random(),
                   ph: Math.random() * 6, delay: 10 + Math.floor(Math.random() * 40) });
    }
    winT = 0;
    closeSheet();
    win.classList.add("show");
    // On phones the results cover the page, so bring them into view (this also scrolls a page that embeds the game)
    if (layout === "portrait") win.querySelector(".win-box").scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
    document.getElementById("again").focus({ preventScroll: true });
  }

  function reset() {
    run++;
    pos = "start"; drawCount = 0; route = []; busy = false; winT = -1; flock = [];
    if (pendingLayout) applyLayout(pendingLayout);
    game = dealGame();
    closeSheet(); flipBtn.disabled = false;
    Object.keys(FRIENDS).forEach(function (n) { var f = FRIENDS[n]; f.x = f.homeX; f.y = f.homeY; f.flip = false; });
    placeToken(pos); token.x += 15; token.y -= 3;
    win.classList.remove("show");
    showSlot();
    deckBtn.disabled = false;
    setStory("Welcome to Austin!", "Bea the Bat is waiting at the Congress Avenue Bridge. Flip a card and hop to the next space of that color. The trail forks three times, so every trip takes a different route.", "bat");
    renderProgress();
  }

  deckBtn.addEventListener("click", draw);
  flipBtn.addEventListener("click", draw);
  continueBtn.addEventListener("click", closeSheet);
  document.getElementById("scrim").addEventListener("click", closeSheet);
  latestBtn.addEventListener("click", openSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  document.getElementById("again").addEventListener("click", function () {
    reset(); (layout === "portrait" ? flipBtn : deckBtn).focus({ preventScroll: true });
  });

  // =====================================================================
  //  Layout: the landscape board with cards underneath on wide screens, or the portrait board
  //  filling the screen with a slide-up window on phones. It goes by the game's own width,
  //  so it works the same full-page or embedded in a narrow column.
  // =====================================================================
  var BREAKPOINT = 640, layout = null, pendingLayout = null;
  function pickLayout() {
    var sideways = window.innerHeight < 500 && window.innerWidth > window.innerHeight;
    return gameEl.clientWidth < BREAKPOINT || sideways ? "portrait" : "landscape";
  }
  // Waits until the elf stops moving, then swaps boards and puts him on the matching space.
  function applyLayout(name) {
    if (busy) { pendingLayout = name; return; }
    pendingLayout = null;
    if (name === layout) return;
    layout = name; gameEl.dataset.layout = name;
    // no slide-in while the layout itself changes
    gameEl.classList.add("switching");
    requestAnimationFrame(function () { requestAnimationFrame(function () { gameEl.classList.remove("switching"); }); });
    if (name === "landscape") gameEl.classList.remove("sheet-open");
    var oldSpaces = spaces;
    useBoard(name);
    if (oldSpaces && pos) {
      pos = sameSpot(pos, oldSpaces);
      placeToken(pos); if (pos === "start") { token.x += 15; token.y -= 3; }
    }
  }
  function useBoard(name) {
    shape = BOARDS[name]; W = shape.W; H = shape.H; LAKE = shape.lake; NODES = {};
    Object.keys(shape.nodes).forEach(function (id) { NODES[id] = { x: shape.nodes[id][0], y: shape.nodes[id][1] }; });
    buildTrail(); placeFriends();
    bgCanvas.width = W; bgCanvas.height = H; taken = []; paintBackground();
    board.width = W; board.height = H; ctx.imageSmoothingEnabled = false;
  }
  // The same spot on the other board: landmarks match exactly; a plain space keeps its place along its stretch of trail.
  function sameSpot(id, oldSpaces) {
    var m = /^(.+):(\d+)$/.exec(id); if (!m) return id;
    var count = function (all) { return Object.keys(all).filter(function (k) { return k.indexOf(m[1] + ":") === 0; }).length; };
    var before = count(oldSpaces), now = count(spaces);
    if (!now) return m[1].split(">")[0];
    return m[1] + ":" + Math.min(now, Math.max(1, Math.round(+m[2] * (now + 1) / (before + 1))));
  }
  new ResizeObserver(function () { applyLayout(pickLayout()); }).observe(gameEl);
  window.addEventListener("resize", function () { applyLayout(pickLayout()); });

  // When embedded in an iframe, tell the host page how tall the game is so the frame can fit it
  if (window.parent !== window && window.ResizeObserver) {
    new ResizeObserver(function () {
      window.parent.postMessage({ batBridgeHeight: Math.ceil(document.body.getBoundingClientRect().height), batBridgeLayout: layout }, "*");
    }).observe(document.body);
  }

  applyLayout(pickLayout());
  reset();
  render();
  if (reduceMotion) {
    // Still animate moves, but skip idle bobbing: redraw only while something changes.
    (function still() { render(); requestAnimationFrame(still); })();
  } else {
    requestAnimationFrame(frameDriver);
  }
})();
</script>
</body>
</html>
